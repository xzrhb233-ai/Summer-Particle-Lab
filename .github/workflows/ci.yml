name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repo
      - name: CPU JS/WASM and protocol tests (no GPU hardware claim)
        run: node scripts/test.mjs --suite core

  native-cad:
    name: Native CAD / Python 3.12 / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cad/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: python -m venv .venv-cad
      - name: Install native CAD dependencies
        run: |
          .venv-cad/bin/python -m pip install --only-binary=:all: -r cad/requirements.txt
      - name: Actual SMLib and TetGen tests (missing prerequisites fail)
        run: node scripts/test.mjs --suite native-cad
